<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d4b">
<meta name="description" content="Sauti Pesa: offline voice and text USDT payments. The AI runs on this device.">
<title>Sauti Pesa</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="layout">
  <main class="app" id="app" aria-live="polite">
    <header class="top">
      <div class="brand">
        <img src="/icon.svg" alt="" width="34" height="34">
        <div>
          <div class="brand-name">Sauti Pesa</div>
          <div class="brand-tag" id="tagline"></div>
        </div>
      </div>
      <div class="top-actions">
        <div class="seg" id="langSeg" role="group">
          <button type="button" data-lang="sw">SW</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
      <div class="testnet" id="testnet" role="note"></div>
    </header>
    <button class="pill" id="pill" type="button"></button>
    <section class="balance" id="balance"></section>
    <section class="view" id="view"></section>
    <nav class="tabs" id="tabs"></nav>
  </main>
  <aside class="side" id="side" aria-label="On-device activity"></aside>
</div>
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<input type="file" id="voiceFile" accept=".wav,.ogg,.oga,.opus,.mp3,.m4a,.webm,audio/*" hidden>
<input type="file" id="shotFile" accept="image/png,image/jpeg" hidden>
</body>
</html>
